<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>خمن الرقم | اختبر نفسك</title><meta name="description" content="لعبة تخمين رقم من 1 إلى 50 مع تلميحات أعلى أو أقل."><meta name="robots" content="index,follow">
<link rel="canonical" href="https://www.ekhtbarnafsak.com/games/guess-the-number.html"><link rel="stylesheet" href="../assets/css/style.css">
<style>.game-area{margin-top:18px}.game-note{min-height:28px;text-align:center;font-weight:700;margin:12px 0}.choice:disabled{opacity:.65}.timer{font-size:1.15rem;font-weight:800;text-align:center;margin:10px}.big-target{min-height:150px;display:flex;align-items:center;justify-content:center;border-radius:18px;background:#f4f6fa;font-size:32px;font-weight:900;margin:18px 0}.big-target.ready{cursor:pointer}.number-input{display:flex;gap:10px;justify-content:center;margin:15px 0}.number-input input{max-width:180px}.mini-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:420px;margin:18px auto}.cell{padding:14px;border-radius:12px;background:#f4f6fa;text-align:center;font-size:24px;font-weight:800}.result strong{display:block;margin-bottom:8px}</style>
</head><body>
<header class="site-header"><div class="container nav"><a class="brand" href="../index.html">اختبر نفسك</a><nav class="nav-links"><a href="../index.html">الرئيسية</a><a href="../daily-challenge.html">تحدي اليوم</a><a href="../about.html">من نحن</a></nav></div></header>
<main class="section"><div class="container game-wrap"><div class="game-head"><span class="badge">التخمين</span><h1>خمن الرقم</h1><p class="muted">اكتشف الرقم السري بأقل عدد من المحاولات.</p></div>
<div class="game-board"><div class="hud"><span>النقاط: <b id="score">0</b></span><span>الجولة: <b id="round">—</b></span></div><div class="progress"><i id="progress"></i></div>
<div id="gameArea" class="game-area"><div class="number-input"><input id="guess" class="input" type="number" min="1" max="50" placeholder="1 - 50"><button id="guessBtn" class="btn btn-primary" type="button">خمن</button></div><div id="hint" class="game-note"></div></div>
<div id="question" class="question"></div><div id="choices" class="choices"></div><div id="feedback" class="game-note"></div>
<div class="actions"><button id="start" class="btn btn-primary" type="button">ابدأ اللعبة</button></div>
<div id="result" class="result"><strong>نتيجتك: <span id="resultScore">0</span> نقطة</strong><p id="resultText"></p><button id="restart" class="btn" type="button">إعادة اللعب</button></div>
</div><div class="ad">مساحة إعلانية</div><div class="prose"><h2>ملاحظة</h2><p>اللعبة للتدريب والترفيه، والنتيجة تعكس أداءك داخل اللعبة فقط وليست تقييمًا نفسيًا معياريًا.</p></div>
</div></main><footer class="footer"><div class="container"><a href="../privacy-policy.html">الخصوصية</a> · <a href="../terms.html">الشروط</a> · <a href="../contact.html">اتصل بنا</a></div></footer>
<script src="../assets/js/analytics.js"></script><script>(function(){var secret=Math.floor(Math.random()*50)+1,attempts=0,done=false,$=id=>document.getElementById(id),start=$("start");function begin(){if(!done){start.style.display="none";$("guess").disabled=false;$("guessBtn").disabled=false;try{trackEvent("game_started",{game:"guess-the-number"})}catch(e){}}}function guess(){if(done)return;var n=Number($("guess").value);if(!Number.isInteger(n)||n<1||n>50){$("hint").textContent="اكتب رقمًا صحيحًا من 1 إلى 50.";return}attempts++;$("round").textContent=attempts;$("progress").style.width=Math.min(100,attempts/10*100)+"%";if(n===secret){done=true;var s=Math.max(10,Math.min(100,110-attempts*10));$("score").textContent=s;$("hint").textContent="✓ أصبت الرقم!";$("resultScore").textContent=s;$("resultText").textContent="وصلت للرقم الصحيح في "+attempts+" محاولة.";$("result").classList.add("show");$("guess").disabled=true;$("guessBtn").disabled=true;try{trackEvent("game_completed",{game:"guess-the-number",score:s})}catch(e){}}else{$("hint").textContent=n<secret?"الرقم السري أكبر.":"الرقم السري أصغر.";$("score").textContent=Math.max(0,100-attempts*10)}}start.onclick=begin;$("guessBtn").onclick=guess;$("guess").onkeydown=e=>{if(e.key==="Enter")guess()};$("restart").onclick=()=>location.reload();$("guess").disabled=true;$("guessBtn").disabled=true;$("round").textContent="0";})();</script></body></html>
