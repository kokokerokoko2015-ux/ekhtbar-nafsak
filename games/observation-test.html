<script src="../assets/js/analytics.js"></script><script>(function(){var Q=[["أي رمز مختلف؟",["●","●","●","○"],3],["أي رقم مختلف؟",["22","22","28","22"],2],["أي كلمة مختلفة؟",["بيت","بيت","باب","بيت"],2],["أي رمز مختلف؟",["★","★","☆","★"],2],["أي رقم مختلف؟",["44","41","44","44"],1],["أي كلمة مختلفة؟",["قلم","قلم","قلم","كتاب"],3],["أي رمز مختلف؟",["▲","▲","▲","△"],3],["أي رقم مختلف؟",["73","73","37","73"],2],["أي كلمة مختلفة؟",["شمس","شمس","قمر","شمس"],2],["أي رمز مختلف؟",["■","■","□","■"],2]];var r=0,correct=0,locked=false;var $=id=>document.getElementById(id),start=$("start");function render(){if(r>=Q.length)return finish();locked=false;$("round").textContent=(r+1)+" / "+Q.length;$("progress").style.width=(r/Q.length*100)+"%";$("question").textContent=Q[r][0];$("feedback").textContent="";$("choices").innerHTML="";Q[r][1].forEach(function(x,i){var b=document.createElement("button");b.className="choice";b.type="button";b.textContent=x;b.onclick=function(){answer(i)};$("choices").appendChild(b)})}function answer(i){if(locked)return;locked=true;Array.from($("choices").children).forEach(b=>b.disabled=true);if(i===Q[r][2]){correct++;$("feedback").textContent="✓ صحيح"}else{$("feedback").textContent="✗ المختلف هو الخيار "+(Q[r][2]+1)};$("score").textContent=Math.round(correct/Q.length*100);setTimeout(()=>{r++;render()},500)}function begin(){start.style.display="none";try{trackEvent("game_started",{game:"observation-test"})}catch(e){}render()}function finish(){var s=Math.round(correct/Q.length*100);$("score").textContent=s;$("round").textContent=Q.length+" / "+Q.length;$("progress").style.width="100%";$("resultScore").textContent=s;$("resultText").textContent=correct+" من "+Q.length+" إجابات صحيحة.";$("result").classList.add("show");try{trackEvent("game_completed",{game:"observation-test",score:s})}catch(e){}}start.onclick=begin;$("restart").onclick=function(){location.reload()};})();</script></body></html>
