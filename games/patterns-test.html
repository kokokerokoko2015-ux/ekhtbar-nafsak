<script src="../assets/js/analytics.js"></script><script>(function(){var Q=[["2، 4، 8، 16، ؟",["24","32","30","36"],1],["3، 6، 9، 12، ؟",["14","15","16","18"],1],["1، 1، 2، 3، 5، ؟",["7","8","9","10"],1],["5، 10، 20، 40، ؟",["60","70","80","90"],2],["20، 18، 16، 14، ؟",["10","12","11","8"],1],["1، 4، 9، 16، ؟",["20","24","25","36"],2],["2، 5، 8، 11، ؟",["13","14","15","16"],1],["30، 27، 24، 21، ؟",["18","17","16","15"],0],["4، 7، 10، 13، ؟",["15","16","17","18"],2],["1، 2، 4، 7، 11، ؟",["15","16","17","18"],1]];var r=0,c=0,lock=false,$=id=>document.getElementById(id),start=$("start");function render(){if(r>=Q.length)return finish();lock=false;$("round").textContent=(r+1)+" / "+Q.length;$("progress").style.width=(r/Q.length*100)+"%";$("question").textContent=Q[r][0];$("feedback").textContent="";$("choices").innerHTML="";Q[r][1].forEach((x,i)=>{var b=document.createElement("button");b.className="choice";b.textContent=x;b.onclick=()=>answer(i);$("choices").appendChild(b)})}function answer(i){if(lock)return;lock=true;Array.from($("choices").children).forEach(b=>b.disabled=true);if(i===Q[r][2])c++;$("feedback").textContent=i===Q[r][2]?"✓ صحيح":"✗ الإجابة الصحيحة: "+Q[r][1][Q[r][2]];$("score").textContent=Math.round(c/Q.length*100);setTimeout(()=>{r++;render()},500)}function begin(){start.style.display="none";try{trackEvent("game_started",{game:"patterns-test"})}catch(e){}render()}function finish(){var s=Math.round(c/Q.length*100);$("score").textContent=s;$("round").textContent=Q.length+" / "+Q.length;$("progress").style.width="100%";$("resultScore").textContent=s;$("resultText").textContent=c+" من "+Q.length+" إجابات صحيحة.";$("result").classList.add("show");try{trackEvent("game_completed",{game:"patterns-test",score:s})}catch(e){}}start.onclick=begin;$("restart").onclick=()=>location.reload();})();</script></body></html>
