<script src="../assets/js/analytics.js"></script><script>(function(){var Q=[["ب ت ك ا ب",["كتاب","كباب","تابك","بيتك"],0],["م د ر س ة",["مدرسة","مدرس","مرسدة","دراسة"],0],["ق ل م",["قلم","قمر","قلب","علم"],0],["ب ا ب",["باب","بابا","آب","با"],0],["ش م س",["شمس","شمعة","مسح","شام"],0],["ك ر س ي",["كرسي","سيرك","سركي","كيس"],0],["س م ك",["سمك","سلك","ملك","مسك"],0],["و ر د ة",["وردة","وريد","ورق","وداد"],0],["ب ح ر",["بحر","برح","حبر","بهر"],0],["ن ج م",["نجم","نغم","نجمى","منج"],0]];var r=0,c=0,lock=false,$=id=>document.getElementById(id),start=$("start");function render(){if(r>=Q.length)return finish();lock=false;$("round").textContent=(r+1)+" / "+Q.length;$("progress").style.width=(r/Q.length*100)+"%";$("question").textContent="رتّب: "+Q[r][0];$("feedback").textContent="";$("choices").innerHTML="";Q[r][1].forEach((x,i)=>{var b=document.createElement("button");b.className="choice";b.textContent=x;b.onclick=()=>answer(i);$("choices").appendChild(b)})}function answer(i){if(lock)return;lock=true;Array.from($("choices").children).forEach(b=>b.disabled=true);if(i===Q[r][2])c++;$("feedback").textContent=i===Q[r][2]?"✓ صحيح":"✗ الصحيح: "+Q[r][1][Q[r][2]];$("score").textContent=Math.round(c/Q.length*100);setTimeout(()=>{r++;render()},500)}function begin(){start.style.display="none";try{trackEvent("game_started",{game:"letter-order"})}catch(e){}render()}function finish(){var s=Math.round(c/Q.length*100);$("score").textContent=s;$("round").textContent=Q.length+" / "+Q.length;$("progress").style.width="100%";$("resultScore").textContent=s;$("resultText").textContent=c+" من "+Q.length+" كلمات صحيحة.";$("result").classList.add("show");try{trackEvent("game_completed",{game:"letter-order",score:s})}catch(e){}}start.onclick=begin;$("restart").onclick=()=>location.reload();})();</script></body></html>
