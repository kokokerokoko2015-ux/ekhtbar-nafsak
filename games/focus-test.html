<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="canonical" href="https://www.ekhtbarnafsak.com/games/focus-test.html"><link rel="stylesheet" href="../assets/css/style.css">
<style>.game-area{margin-top:18px}.game-note{min-height:28px;text-align:center;font-weight:700;margin:12px 0}.choice:disabled{opacity:.65}.timer{font-size:1.15rem;font-weight:800;text-align:center;margin:10px}.big-target{min-height:150px;display:flex;align-items:center;justify-content:center;border-radius:18px;background:#f4f6fa;font-size:32px;font-weight:900;margin:18px 0}.big-target.ready{cursor:pointer}.number-input{display:flex;gap:10px;justify-content:center;margin:15px 0}.number-input input{max-width:180px}.mini-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:420px;margin:18px auto}.cell{padding:14px;border-radius:12px;background:#f4f6fa;text-align:center;font-size:24px;font-weight:800}.result strong{display:block;margin-bottom:8px}</style>
</head><body>
<header class="site-header"><div class="container nav"><a class="brand" href="../index.html">اختبر نفسك</a><nav class="nav-links"><a href="../index.html">الرئيسية</a><a href="../daily-challenge.html">تحدي اليوم</a><a href="../about.html">من نحن</a></nav></div></header>
<main class="section"><div class="container game-wrap"><div class="game-head"><span class="badge">التركيز</span><h1>اختبار التركيز</h1><p class="muted">اختر الرقم المطلوب وسط أرقام مشتتة.</p></div>
<div class="game-board"><div class="hud"><span>النقاط: <b id="score">0</b></span><span>الجولة: <b id="round">—</b></span></div><div class="progress"><i id="progress"></i></div>
<div id="gameArea" class="game-area"><div class="game-note">ابحث عن الرقم <b id="targetNumber">7</b></div></div>
<div id="question" class="question"></div><div id="choices" class="choices"></div><div id="feedback" class="game-note"></div>
<div class="actions"><button id="start" class="btn btn-primary" type="button">ابدأ اللعبة</button></div>
<div id="result" class="result"><strong>نتيجتك: <span id="resultScore">0</span> نقطة</strong><p id="resultText"></p><button id="restart" class="btn" type="button">إعادة اللعب</button></div>
</div><div class="ad">مساحة إعلانية</div><div class="prose"><h2>ملاحظة</h2><p>اللعبة للتدريب والترفيه، والنتيجة تعكس أداءك داخل اللعبة فقط وليست تقييمًا نفسيًا معياريًا.</p></div>
</div></main><footer class="footer"><div class="container"><a href="../privacy-policy.html">الخصوصية</a> · <a href="../terms.html">الشروط</a> · <a href="../contact.html">اتصل بنا</a></div></footer>
<script src="../assets/js/analytics.js"></script><script>(function(){var r=0,correct=0,locked=false,Q=[];for(var i=0;i<10;i++){var t=[2,4,6,7,8,9][i%6],a=[];for(var j=0;j<12;j++)a.push(j===((i*3)%12)?t:[1,2,3,4,5,6,8,9][(i+j)%8]);Q.push({t:t,a:a})}var $=id=>document.getElementById(id),start=$("start");function render(){if(r>=Q.length)return finish();locked=false;var item=Q[r];$("targetNumber").textContent=item.t;$("round").textContent=(r+1)+" / "+Q.length;$("progress").style.width=(r/Q.length*100)+"%";$("feedback").textContent="";$("choices").innerHTML="";item.a.forEach(function(x,i){var b=document.createElement("button");b.className="choice";b.textContent=x;b.type="button";b.onclick=function(){answer(i)};$("choices").appendChild(b)})}function answer(i){if(locked)return;locked=true;Array.from($("choices").children).forEach(b=>b.disabled=true);var ok=Q[r].a[i]===Q[r].t;if(ok)correct++;$("feedback").textContent=ok?"✓ ممتاز":"✗ حاول التركيز أكثر";$("score").textContent=Math.round(correct/Q.length*100);setTimeout(()=>{r++;render()},450)}function begin(){start.style.display="none";try{trackEvent("game_started",{game:"focus-test"})}catch(e){}render()}function finish(){var s=Math.round(correct/Q.length*100);$("score").textContent=s;$("round").textContent=Q.length+" / "+Q.length;$("progress").style.width="100%";$("resultScore").textContent=s;$("resultText").textContent=correct+" من "+Q.length+" اختيارات صحيحة.";$("result").classList.add("show");try{trackEvent("game_completed",{game:"focus-test",score:s})}catch(e){}}start.onclick=begin;$("restart").onclick=()=>location.reload();})();</script></body></html>
