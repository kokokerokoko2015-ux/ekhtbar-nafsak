<script src="../assets/js/analytics.js"></script><script>(function(){var r=0,correct=0,locked=false,Q=[];for(var i=0;i<10;i++){var a=7+i,b=3+(i%5),op=i%3,ans=op===0?a+b:op===1?a*b:a-b;Q.push({q:a+(op===0?" + ":op===1?" × ":" − ")+b,a:ans,c:[ans,ans+(i%2?2:-2),ans+5,Math.max(0,ans-3)]})}Q.forEach(x=>{x.c=x.c.sort(()=>Math.random()-.5)});var $=id=>document.getElementById(id),start=$("start");function render(){if(r>=Q.length)return finish();locked=false;$("round").textContent=(r+1)+" / "+Q.length;$("progress").style.width=(r/Q.length*100)+"%";$("question").textContent=Q[r].q;$("feedback").textContent="";$("choices").innerHTML="";Q[r].c.forEach(function(x){var b=document.createElement("button");b.className="choice";b.textContent=x;b.type="button";b.onclick=function(){answer(x)};$("choices").appendChild(b)})}function answer(x){if(locked)return;locked=true;Array.from($("choices").children).forEach(b=>b.disabled=true);var ok=x===Q[r].a;if(ok)correct++;$("feedback").textContent=ok?"✓ صحيح":"✗ الإجابة الصحيحة: "+Q[r].a;$("score").textContent=Math.round(correct/Q.length*100);setTimeout(()=>{r++;render()},500)}function begin(){start.style.display="none";try{trackEvent("game_started",{game:"math-speed-test"})}catch(e){}render()}function finish(){var s=Math.round(correct/Q.length*100);$("score").textContent=s;$("round").textContent=Q.length+" / "+Q.length;$("progress").style.width="100%";$("resultScore").textContent=s;$("resultText").textContent=correct+" من "+Q.length+" مسائل صحيحة.";$("result").classList.add("show");try{trackEvent("game_completed",{game:"math-speed-test",score:s})}catch(e){}}start.onclick=begin;$("restart").onclick=()=>location.reload();})();</script></body></html>
